name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PRISMA_SCHEMA: apps/api/prisma/schema.prisma

jobs:
  # lint + typecheck + unit tests (no database required)
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema ${{ env.PRISMA_SCHEMA }}
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # real Postgres + seeded DB + HTTP end-to-end suite
  integration:
    runs-on: ubuntu-latest
    needs: [verify]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: guitarhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/guitarhub?schema=public
      APP_URL: http://localhost:4000
      PORT: "4000"
      STORAGE_DRIVER: local
      STORAGE_SIGNING_SECRET: ci-integration-signing-secret
      HIBP_CHECK: "false"
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema ${{ env.PRISMA_SCHEMA }}
      - name: Apply migrations
        run: npm run db:deploy -w api
      - name: Seed database
        run: npm run db:seed -w api
      - name: Build API
        run: npm run build -w api
      - name: Start API
        run: |
          npm run start -w api > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/api/v1/health && break
            sleep 1
          done
      - name: Integration tests
        run: npm run test:integration
      - name: API log
        if: always()
        run: cat api.log || true

  # production build of both apps (gated on the suites above)
  build:
    runs-on: ubuntu-latest
    needs: [verify, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema ${{ env.PRISMA_SCHEMA }}
      - name: Build
        run: npm run build
