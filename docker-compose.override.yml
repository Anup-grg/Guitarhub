version: "3.9"
services:
  api:
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./apps/api:/app/apps/api:ro
      - ./node_modules:/app/node_modules:ro
    command: npm run dev -w api
  web:
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/web:/app/apps/web:ro
      - ./node_modules:/app/node_modules:ro
    command: npm run dev -w web
