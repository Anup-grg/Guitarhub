stages: [verify, integration, build, security, deploy]

default:
  image: node:22-alpine
  cache:
    key: { files: [package-lock.json] }
    paths: [.npm/]

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# ---------- verify: lint + typecheck + unit tests (node-only, no DB) ----------
verify:
  stage: verify
  script:
    - npm ci --cache .npm --prefer-offline
    - npx prisma generate --schema apps/api/prisma/schema.prisma
    - npm run lint
    - npm run typecheck
    # coverage thresholds in the vitest configs gate the pipeline
    - npm run test:coverage
  artifacts:
    when: always
    paths: [apps/api/coverage/lcov.info, apps/web/coverage/lcov.info]
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------- integration: real Postgres + seeded DB + HTTP e2e ----------
integration:
  stage: integration
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: guitarhub
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/guitarhub?schema=public
    APP_URL: http://localhost:4000
    PORT: "4000"
    STORAGE_DRIVER: local
    STORAGE_SIGNING_SECRET: ci-integration-signing-secret
    HIBP_CHECK: "false"
  script:
    - npm ci --cache .npm --prefer-offline
    - npx prisma generate --schema apps/api/prisma/schema.prisma
    - npm run db:deploy -w api
    - npm run db:seed -w api
    - npm run build -w api
    - (npm run start -w api > api.log 2>&1 &)
    - npm run test:integration
  artifacts:
    when: always
    paths: [api.log]
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------- build: publish images to the GitLab Container Registry ----------
.build:
  stage: build
  image: { name: gcr.io/kaniko-project/executor:v1.23.2-debug, entrypoint: [""] }
  script:
    - mkdir -p /kaniko/.docker
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/apps/$APP/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/$APP:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE/$APP:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:api:
  extends: .build
  variables: { APP: api }

build:web:
  extends: .build
  variables: { APP: web }

# ---------- security: templates + npm audit ----------
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml

container_scanning:
  stage: security
  needs: ["build:api"]
  variables:
    CS_IMAGE: $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA

npm-audit:
  stage: security
  allow_failure: true
  script:
    - npm ci --cache .npm --prefer-offline
    - npm audit --omit=dev || true

# ---------- deploy: SSH -> docker compose pull/up on the server ----------
deploy:
  stage: deploy
  image: alpine:3.20
  needs: ["build:api", "build:web", "integration"]
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - rsync -az --delete --exclude '.env' deploy/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && IMAGE_TAG='$CI_COMMIT_SHORT_SHA' REGISTRY='$CI_REGISTRY_IMAGE' REGISTRY_USER='$CI_REGISTRY_USER' REGISTRY_PASSWORD='$CI_REGISTRY_PASSWORD' sh deploy/deploy.sh"
  environment:
    name: production
    url: https://guitarhub.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
